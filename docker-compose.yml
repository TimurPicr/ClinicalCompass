services:
  # Keep the existing service name and volume for compatibility with run.sh.
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-clinical_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-clinical_compass}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 30
    networks:
      default:
        aliases: [postgresql]

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-clinical_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-clinical_compass}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      RAG_ENABLED: ${RAG_ENABLED:-false}
      RAG_SERVICE_URL: ${RAG_SERVICE_URL:-http://host.docker.internal:8001/recommend}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-["http://localhost:5173", "http://127.0.0.1:5173"]}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:5173}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURITY: ${SMTP_SECURITY:-none}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-Clinical Compass <notifications@localhost>}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 30
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"

  frontend:
    build:
      context: app/frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:8080"

  # Development mailbox. Replace SMTP settings for delivery to real mailboxes.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:${MAIL_UI_PORT:-8025}:8025"
      - "127.0.0.1:${SMTP_LOCAL_PORT:-1025}:1025"
    volumes:
      - mailpit_data:/data
    environment:
      MP_DATABASE: /data/mailpit.db

volumes:
  postgres_data:
  mailpit_data:
